services:
  backend-app:
    container_name: warehub-app-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - shared-services

networks:
  shared-services:
    name: shared-services
    external: true

name: warehub
