services:
  redis:
    image: redis:6-alpine
    container_name: warehub-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  backend-app:
    container_name: warehub-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    expose:
      - "8080"
    depends_on:
      - warehub-redis

  nginx:
    image: nginx:alpine
    container_name: warehub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/warehub-backend.conf:/etc/nginx/conf.d/warehub-backend.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - warehub-backend

volumes:
  redis_data:

name: warehub