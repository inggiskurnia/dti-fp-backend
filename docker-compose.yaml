services:
  redis:
    image: redis:6-alpine
    container_name: warehub-redis
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  backend-app:
    container_name: warehub-backend
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - redis

volumes:
  redis_data:

name: warehub